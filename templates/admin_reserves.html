<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
  <title>Резервы</title>
  <link rel="stylesheet" href="/static/css/base.css"/>
  <link rel="stylesheet" href="/static/css/shipments.css"/>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

</head>
<body>
<div class="container">
  <header class="toolbar">
    <h1 style="margin:0;font-size:20px">Резервы</h1>
    <div class="tool-left">
      <a class="btn" href="/">Закрыть</a>
    </div>
  </header>

  <section class="card">
    <h2 style="margin:0 0 10px 0;font-size:18px">Админы</h2>
    <div id="admins" class="ship-list"></div>
    <div style="margin-top:10px">
      <button id="btnUnknown" class="btn sm">Непонятные</button>
      <span id="unknownCount" class="meta" style="margin-left:8px;color:var(--muted)"></span>
    </div>
  </section>

  <section class="card" id="secList" style="margin-top:12px">
    <h2 id="listTitle" style="margin:0 0 10px 0;font-size:18px">Список резервов</h2>
    <div id="list" class="ship-list"></div>
  </section>
</div>

<div id="detail" class="detail hidden">
  <div class="detail-inner">
    <div id="detailCard" class="detail-card"></div>
  </div>
</div>

<!-- Busy overlay -->
<div id="busy" class="busy">
  <div class="box">
    <div class="spinner"></div>
    <span id="busyText">Выполняю…</span>
  </div>
</div>

<script type="module" src="/static/js/reserves.js?v={{ ver }}"></script>

</body>
</html>
