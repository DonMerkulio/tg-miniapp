<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title>Пользователи</title>
  <link rel="stylesheet" href="/static/css/base.css"/>
  <link rel="stylesheet" href="/static/css/users.css"/>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

</head>
<body>
<div class="container">
  <header class="toolbar">
    <h1 style="margin:0;font-size:20px">Пользователи</h1>
    <div class="tool-left">
      <a class="btn" href="/">Назад</a>
    </div>
  </header>

  <section class="card">
    <div class="field" style="margin-bottom:10px">
      <label>Поиск (имя или телефон)</label>
      <input id="q" class="search" placeholder="Например: Иван или +375..." />
    </div>
    <div id="usersList" class="user-list"></div>
  </section>
</div>

<div id="detail" class="detail hidden">
  <div class="detail-inner">
    <div id="detailCard" class="detail-card"></div>
  </div>
</div>

<!-- Busy overlay -->
<div id="busy" class="busy">
  <div class="box">
    <div class="spinner"></div>
    <span id="busyText">Загружаю…</span>
  </div>
</div>

<script type="module" src="/static/js/users_admin.js"></script>
</body>
</html>
